<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatty Pet</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; user-select: none; }
      body { display: grid; place-items: center; }
      .pet { position: relative; width: 146px; height: 186px; display: grid; place-items: center; cursor: grab; }
      .pet:active { cursor: grabbing; }
      .portrait { position: relative; width: 140px; filter: drop-shadow(0 8px 9px rgba(0,0,0,.28)); }
      .portrait img { display: block; width: 100%; height: auto; pointer-events: none; }
      .close { position: absolute; right: 4px; top: 4px; width: 25px; height: 25px; padding: 0; border: 1px solid rgba(255,255,255,.2); border-radius: 50%; color: rgba(255,255,255,.86); background: rgba(5,5,7,.72); font-size: 16px; line-height: 21px; opacity: 0; transition: opacity .18s ease; cursor: pointer; }
      .pet:hover .close { opacity: 1; }
    </style>
  </head>
  <body>
    <div class="pet" data-pet title="Drag me · Double-click to open Chatty">
      <div class="portrait"><img src="chatty-pet.gif" alt="Chatty" /></div>
      <button class="close" type="button" data-close aria-label="Hide Chatty pet">×</button>
    </div>
  </body>
</html>
